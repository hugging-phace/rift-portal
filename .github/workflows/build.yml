name: Build Magnet Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-agent.txt
      - name: Build Windows agent
        run: |
          pyinstaller --noconsole --name "MagnetAgent" --hidden-import magnet_vision --hidden-import magnet_orb --hidden-import PIL --hidden-import mss "Magnet Agent.pyw"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetAgent-windows
          path: dist/MagnetAgent

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-agent.txt
      - name: Build macOS agent
        run: |
          pyinstaller --windowed --name "MagnetAgent" --hidden-import magnet_vision --hidden-import magnet_orb --hidden-import PIL --hidden-import mss "Magnet Agent.pyw"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetAgent-macos
          path: dist/MagnetAgent.app
