name: Build Magnet Agent v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          cat > release_notes.md <<'EOF'
          Standalone Magnet Agent and Magnet Client v2 built from `main`.

          - **Agent (Windows)**: `MagnetAgent-windows.zip` (extract and run `MagnetAgent/MagnetAgent.exe`)
          - **Agent (macOS)**: `MagnetAgent-macos.zip` (extract `MagnetAgent.app` and open)
          - **Client (Windows)**: `MagnetClient-windows.zip` (extract and run `MagnetClient/MagnetClient.exe`)
          - **Client (macOS)**: `MagnetClient-macos.zip` (extract `MagnetClient.app` and open; it lives in the menu bar)
          EOF
          gh release create "$TAG" \
            --draft \
            --title "MagnetOS v2 Build ${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes-file release_notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-windows:
    runs-on: windows-latest
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || github.ref != 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-agent.txt
      - name: Build Windows agent
        run: |
          pyinstaller --noconsole --name "MagnetAgent" `
            --icon "assets\icon.ico" `
            --hidden-import base64 `
            --hidden-import datetime `
            --hidden-import email.mime.multipart `
            --hidden-import email.mime.text `
            --hidden-import io `
            --hidden-import json `
            --hidden-import math `
            --hidden-import os `
            --hidden-import pathlib `
            --hidden-import platform `
            --hidden-import random `
            --hidden-import secrets `
            --hidden-import shutil `
            --hidden-import smtplib `
            --hidden-import subprocess `
            --hidden-import sys `
            --hidden-import threading `
            --hidden-import time `
            --hidden-import urllib.request `
            --hidden-import uuid `
            --hidden-import zipfile `
            --hidden-import hashlib `
            --hidden-import tempfile `
            --hidden-import certifi `
            --collect-data certifi `
            --hidden-import magnet_vision `
            --hidden-import magnet_orb `
            --hidden-import magnet_v2_glyph `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageGrab `
            --hidden-import mss `
            --add-data "Magnet Agent v2 Prototype.pyw;." `
            --add-data "Magnet Agent.pyw;." `
            "Magnet Agent v2.pyw"
      - name: Upload Windows agent release asset
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          Move-Item -Path dist\MagnetAgent -Destination MagnetAgent
          Compress-Archive -Path MagnetAgent -DestinationPath MagnetAgent-windows.zip
          gh release upload "$env:TAG" MagnetAgent-windows.zip --clobber

  build-macos:
    runs-on: macos-latest
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || github.ref != 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-agent.txt
      - name: Build macOS agent
        run: |
          pyinstaller --windowed --name "MagnetAgent" \
            --icon "assets/icon.icns" \
            --osx-bundle-identifier "com.magnetos.agent" \
            --hidden-import base64 \
            --hidden-import datetime \
            --hidden-import email.mime.multipart \
            --hidden-import email.mime.text \
            --hidden-import io \
            --hidden-import json \
            --hidden-import math \
            --hidden-import os \
            --hidden-import pathlib \
            --hidden-import platform \
            --hidden-import random \
            --hidden-import secrets \
            --hidden-import shutil \
            --hidden-import smtplib \
            --hidden-import subprocess \
            --hidden-import sys \
            --hidden-import threading \
            --hidden-import time \
            --hidden-import urllib.request \
            --hidden-import uuid \
            --hidden-import zipfile \
            --hidden-import hashlib \
            --hidden-import tempfile \
            --hidden-import certifi \
            --collect-data certifi \
            --hidden-import magnet_vision \
            --hidden-import magnet_orb \
            --hidden-import magnet_v2_glyph \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageGrab \
            --hidden-import mss \
            --add-data "Magnet Agent v2 Prototype.pyw:." \
            --add-data "Magnet Agent.pyw:." \
            "Magnet Agent v2.pyw"
      - name: Fix macOS app permissions and signature
        run: |
          chmod +x "dist/MagnetAgent.app/Contents/MacOS/MagnetAgent"
          codesign --force --deep --sign - "dist/MagnetAgent.app"
      - name: Upload macOS agent release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          cd dist
          zip -r ../MagnetAgent-macos.zip MagnetAgent.app
          cd ..
          gh release upload "$TAG" MagnetAgent-macos.zip --clobber

  build-client-windows:
    runs-on: windows-latest
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || github.ref != 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-client.txt
      - name: Build Windows client
        run: |
          pyinstaller --noconsole --name "MagnetClient" `
            --icon "assets\icon.ico" `
            --hidden-import base64 `
            --hidden-import ctypes `
            --hidden-import datetime `
            --hidden-import io `
            --hidden-import json `
            --hidden-import math `
            --hidden-import os `
            --hidden-import pathlib `
            --hidden-import platform `
            --hidden-import random `
            --hidden-import secrets `
            --hidden-import shutil `
            --hidden-import struct `
            --hidden-import subprocess `
            --hidden-import sys `
            --hidden-import threading `
            --hidden-import time `
            --hidden-import urllib.request `
            --hidden-import uuid `
            --hidden-import zlib `
            --hidden-import zipfile `
            --hidden-import hashlib `
            --hidden-import tempfile `
            --hidden-import certifi `
            --collect-data certifi `
            --hidden-import magnet_vision `
            --hidden-import magnet_orb `
            --hidden-import magnet_v2_glyph `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageGrab `
            --hidden-import mss `
            --add-data "Magnet Client.pyw;." `
            "Magnet Client v2.pyw"
      - name: Upload Windows client release asset
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          Move-Item -Path dist\MagnetClient -Destination MagnetClient
          Compress-Archive -Path MagnetClient -DestinationPath MagnetClient-windows.zip
          gh release upload "$env:TAG" MagnetClient-windows.zip --clobber

  build-client-macos:
    runs-on: macos-latest
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || github.ref != 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-client.txt
      - name: Build macOS client
        run: |
          pyinstaller --windowed --name "MagnetClient" \
            --icon "assets/icon.icns" \
            --osx-bundle-identifier "com.magnetos.client" \
            --hidden-import base64 \
            --hidden-import ctypes \
            --hidden-import datetime \
            --hidden-import io \
            --hidden-import json \
            --hidden-import math \
            --hidden-import os \
            --hidden-import pathlib \
            --hidden-import platform \
            --hidden-import random \
            --hidden-import secrets \
            --hidden-import shutil \
            --hidden-import struct \
            --hidden-import subprocess \
            --hidden-import sys \
            --hidden-import threading \
            --hidden-import time \
            --hidden-import urllib.request \
            --hidden-import uuid \
            --hidden-import zlib \
            --hidden-import zipfile \
            --hidden-import hashlib \
            --hidden-import tempfile \
            --hidden-import certifi \
            --collect-data certifi \
            --hidden-import magnet_vision \
            --hidden-import magnet_orb \
            --hidden-import magnet_v2_glyph \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageGrab \
            --hidden-import mss \
            --add-data "Magnet Client.pyw:." \
            "Magnet Client v2.pyw"
      - name: Fix macOS client permissions and signature
        run: |
          chmod +x "dist/MagnetClient.app/Contents/MacOS/MagnetClient"
          /usr/libexec/PlistBuddy -c "Set :LSUIElement true" \
            "dist/MagnetClient.app/Contents/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" \
            "dist/MagnetClient.app/Contents/Info.plist" 2>/dev/null || true
          codesign --force --deep --sign - "dist/MagnetClient.app"
      - name: Upload macOS client release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          cd dist
          zip -r ../MagnetClient-macos.zip MagnetClient.app
          cd ..
          gh release upload "$TAG" MagnetClient-macos.zip --clobber

  publish-release:
    runs-on: ubuntu-latest
    needs: [create-release, build-windows, build-macos, build-client-windows, build-client-macos]
    if: github.ref == 'refs/heads/main' && success()
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
