name: Build Magnet Agent v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-agent.txt
      - name: Build Windows agent
        run: |
          pyinstaller --noconsole --name "MagnetAgent" `
            --icon "assets\icon.ico" `
            --hidden-import base64 `
            --hidden-import datetime `
            --hidden-import email.mime.multipart `
            --hidden-import email.mime.text `
            --hidden-import io `
            --hidden-import json `
            --hidden-import math `
            --hidden-import os `
            --hidden-import pathlib `
            --hidden-import platform `
            --hidden-import random `
            --hidden-import secrets `
            --hidden-import shutil `
            --hidden-import smtplib `
            --hidden-import subprocess `
            --hidden-import sys `
            --hidden-import threading `
            --hidden-import time `
            --hidden-import urllib.request `
            --hidden-import uuid `
            --hidden-import zipfile `
            --hidden-import hashlib `
            --hidden-import tempfile `
            --hidden-import magnet_vision `
            --hidden-import magnet_orb `
            --hidden-import magnet_v2_glyph `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageGrab `
            --hidden-import mss `
            --add-data "Magnet Agent v2 Prototype.pyw;." `
            --add-data "Magnet Agent.pyw;." `
            "Magnet Agent v2.pyw"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetAgent-windows
          path: dist/MagnetAgent

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-agent.txt
      - name: Build macOS agent
        run: |
          pyinstaller --windowed --name "MagnetAgent" \
            --icon "assets/icon.icns" \
            --osx-bundle-identifier "com.magnetos.agent" \
            --hidden-import base64 \
            --hidden-import datetime \
            --hidden-import email.mime.multipart \
            --hidden-import email.mime.text \
            --hidden-import io \
            --hidden-import json \
            --hidden-import math \
            --hidden-import os \
            --hidden-import pathlib \
            --hidden-import platform \
            --hidden-import random \
            --hidden-import secrets \
            --hidden-import shutil \
            --hidden-import smtplib \
            --hidden-import subprocess \
            --hidden-import sys \
            --hidden-import threading \
            --hidden-import time \
            --hidden-import urllib.request \
            --hidden-import uuid \
            --hidden-import zipfile \
            --hidden-import hashlib \
            --hidden-import tempfile \
            --hidden-import magnet_vision \
            --hidden-import magnet_orb \
            --hidden-import magnet_v2_glyph \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageGrab \
            --hidden-import mss \
            --add-data "Magnet Agent v2 Prototype.pyw:." \
            --add-data "Magnet Agent.pyw:." \
            "Magnet Agent v2.pyw"
      - name: Fix macOS app permissions and signature
        run: |
          chmod +x "dist/MagnetAgent.app/Contents/MacOS/MagnetAgent"
          codesign --force --deep --sign - "dist/MagnetAgent.app"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetAgent-macos
          path: dist/MagnetAgent.app

  build-client-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-client.txt
      - name: Build Windows client
        run: |
          pyinstaller --noconsole --name "MagnetClient" `
            --icon "assets\icon.ico" `
            --hidden-import base64 `
            --hidden-import ctypes `
            --hidden-import datetime `
            --hidden-import io `
            --hidden-import json `
            --hidden-import math `
            --hidden-import os `
            --hidden-import pathlib `
            --hidden-import platform `
            --hidden-import random `
            --hidden-import secrets `
            --hidden-import shutil `
            --hidden-import struct `
            --hidden-import subprocess `
            --hidden-import sys `
            --hidden-import threading `
            --hidden-import time `
            --hidden-import urllib.request `
            --hidden-import uuid `
            --hidden-import zlib `
            --hidden-import zipfile `
            --hidden-import hashlib `
            --hidden-import tempfile `
            --hidden-import magnet_vision `
            --hidden-import magnet_orb `
            --hidden-import magnet_v2_glyph `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageGrab `
            --hidden-import mss `
            --add-data "Magnet Client.pyw;." `
            "Magnet Client v2.pyw"
      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetClient-windows
          path: dist/MagnetClient

  build-client-macos:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-client.txt
      - name: Build macOS client
        run: |
          pyinstaller --windowed --name "MagnetClient" \
            --icon "assets/icon.icns" \
            --osx-bundle-identifier "com.magnetos.client" \
            --hidden-import base64 \
            --hidden-import ctypes \
            --hidden-import datetime \
            --hidden-import io \
            --hidden-import json \
            --hidden-import math \
            --hidden-import os \
            --hidden-import pathlib \
            --hidden-import platform \
            --hidden-import random \
            --hidden-import secrets \
            --hidden-import shutil \
            --hidden-import struct \
            --hidden-import subprocess \
            --hidden-import sys \
            --hidden-import threading \
            --hidden-import time \
            --hidden-import urllib.request \
            --hidden-import uuid \
            --hidden-import zlib \
            --hidden-import zipfile \
            --hidden-import hashlib \
            --hidden-import tempfile \
            --hidden-import magnet_vision \
            --hidden-import magnet_orb \
            --hidden-import magnet_v2_glyph \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageGrab \
            --hidden-import mss \
            --add-data "Magnet Client.pyw:." \
            "Magnet Client v2.pyw"
      - name: Fix macOS client permissions and signature
        run: |
          chmod +x "dist/MagnetClient.app/Contents/MacOS/MagnetClient"
          # The client is a tray/menu-bar app; hide the dock icon before signing
          # so the signature stays valid.
          /usr/libexec/PlistBuddy -c "Set :LSUIElement true" \
            "dist/MagnetClient.app/Contents/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" \
            "dist/MagnetClient.app/Contents/Info.plist" 2>/dev/null || true
          codesign --force --deep --sign - "dist/MagnetClient.app"
      - name: Upload macOS client artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetClient-macos
          path: dist/MagnetClient.app

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-client-windows, build-client-macos]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Windows agent artifact
        uses: actions/download-artifact@v4
        with:
          name: MagnetAgent-windows
          path: ./windows
      - name: Download macOS agent artifact
        uses: actions/download-artifact@v4
        with:
          name: MagnetAgent-macos
          path: ./macos
      - name: Download Windows client artifact
        uses: actions/download-artifact@v4
        with:
          name: MagnetClient-windows
          path: ./windows-client
      - name: Download macOS client artifact
        uses: actions/download-artifact@v4
        with:
          name: MagnetClient-macos
          path: ./macos-client
      - name: Package release assets
        run: |
          # actions/download-artifact extracts the artifact contents directly into
          # the download path. Re-stage the files under the expected top-level
          # folder/app names before zipping.
          mkdir -p MagnetAgent
          cp -a windows/* MagnetAgent/ 2>/dev/null || true
          zip -r MagnetAgent-windows.zip MagnetAgent

          mkdir -p MagnetAgent.app
          cp -a macos/* MagnetAgent.app/ 2>/dev/null || true
          if [ -f MagnetAgent.app/Contents/MacOS/MagnetAgent ]; then
            chmod +x MagnetAgent.app/Contents/MacOS/MagnetAgent
          fi
          find MagnetAgent.app/Contents/MacOS -type f -exec chmod +x {} +
          zip -r MagnetAgent-macos.zip MagnetAgent.app

          mkdir -p MagnetClient
          cp -a windows-client/* MagnetClient/ 2>/dev/null || true
          zip -r MagnetClient-windows.zip MagnetClient

          mkdir -p MagnetClient.app
          cp -a macos-client/* MagnetClient.app/ 2>/dev/null || true
          if [ -f MagnetClient.app/Contents/MacOS/MagnetClient ]; then
            chmod +x MagnetClient.app/Contents/MacOS/MagnetClient
          fi
          find MagnetClient.app/Contents/MacOS -type f -exec chmod +x {} +
          zip -r MagnetClient-macos.zip MagnetClient.app
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: MagnetOS v2 Build ${{ github.run_number }}
          body: |
            Standalone Magnet Agent and Magnet Client v2 built from `main`.

            - **Agent (Windows)**: `MagnetAgent-windows.zip` (extract and run `MagnetAgent/MagnetAgent.exe`)
            - **Agent (macOS)**: `MagnetAgent-macos.zip` (extract `MagnetAgent.app` and open)
            - **Client (Windows)**: `MagnetClient-windows.zip` (extract and run `MagnetClient/MagnetClient.exe`)
            - **Client (macOS)**: `MagnetClient-macos.zip` (extract `MagnetClient.app` and open; it lives in the menu bar)
          files: |
            MagnetAgent-windows.zip
            MagnetAgent-macos.zip
            MagnetClient-windows.zip
            MagnetClient-macos.zip
          generate_release_notes: false
          make_latest: true
