name: Build Magnet Agent v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-agent.txt
      - name: Build Windows agent
        run: |
          pyinstaller --noconsole --name "MagnetAgent" `
            --hidden-import base64 `
            --hidden-import datetime `
            --hidden-import email.mime.multipart `
            --hidden-import email.mime.text `
            --hidden-import io `
            --hidden-import json `
            --hidden-import math `
            --hidden-import os `
            --hidden-import pathlib `
            --hidden-import platform `
            --hidden-import random `
            --hidden-import secrets `
            --hidden-import shutil `
            --hidden-import smtplib `
            --hidden-import subprocess `
            --hidden-import sys `
            --hidden-import threading `
            --hidden-import time `
            --hidden-import urllib.request `
            --hidden-import uuid `
            --hidden-import zipfile `
            --hidden-import hashlib `
            --hidden-import tempfile `
            --hidden-import magnet_vision `
            --hidden-import magnet_orb `
            --hidden-import magnet_v2_glyph `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageGrab `
            --hidden-import mss `
            --add-data "Magnet Agent v2 Prototype.pyw;." `
            --add-data "Magnet Agent.pyw;." `
            "Magnet Agent v2.pyw"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetAgent-windows
          path: dist/MagnetAgent

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-agent.txt
      - name: Build macOS agent
        run: |
          pyinstaller --windowed --name "MagnetAgent" \
            --hidden-import base64 \
            --hidden-import datetime \
            --hidden-import email.mime.multipart \
            --hidden-import email.mime.text \
            --hidden-import io \
            --hidden-import json \
            --hidden-import math \
            --hidden-import os \
            --hidden-import pathlib \
            --hidden-import platform \
            --hidden-import random \
            --hidden-import secrets \
            --hidden-import shutil \
            --hidden-import smtplib \
            --hidden-import subprocess \
            --hidden-import sys \
            --hidden-import threading \
            --hidden-import time \
            --hidden-import urllib.request \
            --hidden-import uuid \
            --hidden-import zipfile \
            --hidden-import hashlib \
            --hidden-import tempfile \
            --hidden-import magnet_vision \
            --hidden-import magnet_orb \
            --hidden-import magnet_v2_glyph \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageGrab \
            --hidden-import mss \
            --add-data "Magnet Agent v2 Prototype.pyw:." \
            --add-data "Magnet Agent.pyw:." \
            "Magnet Agent v2.pyw"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetAgent-macos
          path: dist/MagnetAgent.app

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MagnetAgent-windows
          path: ./windows
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MagnetAgent-macos
          path: ./macos
      - name: Package release assets
        run: |
          cd windows
          zip -r ../MagnetAgent-windows.zip MagnetAgent
          cd ../macos
          zip -r ../MagnetAgent-macos.zip MagnetAgent.app
          cd ..
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Magnet Agent v2 Build ${{ github.run_number }}
          body: |
            Standalone Magnet Agent v2 built from `main`.

            - **Windows**: `MagnetAgent-windows.zip` (extract and run `MagnetAgent/MagnetAgent.exe`)
            - **macOS**: `MagnetAgent-macos.zip` (extract `MagnetAgent.app` and open)
          files: |
            MagnetAgent-windows.zip
            MagnetAgent-macos.zip
          generate_release_notes: false
          make_latest: true
