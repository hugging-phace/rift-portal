name: Build Magnet Agent v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-agent.txt
      - name: Build Windows agent
        run: |
          pyinstaller --noconsole --name "MagnetAgent" `
            --hidden-import base64 `
            --hidden-import datetime `
            --hidden-import email.mime.multipart `
            --hidden-import email.mime.text `
            --hidden-import io `
            --hidden-import json `
            --hidden-import math `
            --hidden-import os `
            --hidden-import pathlib `
            --hidden-import platform `
            --hidden-import random `
            --hidden-import secrets `
            --hidden-import shutil `
            --hidden-import smtplib `
            --hidden-import subprocess `
            --hidden-import sys `
            --hidden-import threading `
            --hidden-import time `
            --hidden-import urllib.request `
            --hidden-import uuid `
            --hidden-import zipfile `
            --hidden-import hashlib `
            --hidden-import tempfile `
            --hidden-import magnet_vision `
            --hidden-import magnet_orb `
            --hidden-import magnet_v2_glyph `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageGrab `
            --hidden-import mss `
            --add-data "Magnet Agent v2 Prototype.pyw;." `
            --add-data "Magnet Agent.pyw;." `
            "Magnet Agent v2.pyw"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetAgent-windows
          path: dist/MagnetAgent

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-agent.txt
      - name: Build macOS agent
        run: |
          pyinstaller --windowed --name "MagnetAgent" \
            --hidden-import base64 \
            --hidden-import datetime \
            --hidden-import email.mime.multipart \
            --hidden-import email.mime.text \
            --hidden-import io \
            --hidden-import json \
            --hidden-import math \
            --hidden-import os \
            --hidden-import pathlib \
            --hidden-import platform \
            --hidden-import random \
            --hidden-import secrets \
            --hidden-import shutil \
            --hidden-import smtplib \
            --hidden-import subprocess \
            --hidden-import sys \
            --hidden-import threading \
            --hidden-import time \
            --hidden-import urllib.request \
            --hidden-import uuid \
            --hidden-import zipfile \
            --hidden-import hashlib \
            --hidden-import tempfile \
            --hidden-import magnet_vision \
            --hidden-import magnet_orb \
            --hidden-import magnet_v2_glyph \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageGrab \
            --hidden-import mss \
            --add-data "Magnet Agent v2 Prototype.pyw:." \
            --add-data "Magnet Agent.pyw:." \
            "Magnet Agent v2.pyw"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetAgent-macos
          path: dist/MagnetAgent.app
